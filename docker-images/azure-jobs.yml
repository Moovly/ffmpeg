

jobs:
- job: Build_Docker_Images
  pool:
    vmImage: ubuntu-latest
  strategy:
    maxParallel: 10
    matrix:

      alpine313_6.0:
        MAJOR_VERSION: 6
        VERSION:  6.0
        LONG_VERSION: 6.0
        VARIANT:  alpine313
        PARENT: alpine
        ISPARENT:  True


      alpine313_5.1.2:
        MAJOR_VERSION: 5
        VERSION:  5.1
        LONG_VERSION: 5.1.2
        VARIANT:  alpine313
        PARENT: alpine
        ISPARENT:  True


      alpine313_4.4.3:
        MAJOR_VERSION: 4
        VERSION:  4.4
        LONG_VERSION: 4.4.3
        VARIANT:  alpine313
        PARENT: alpine
        ISPARENT:  True

  steps:
  - template: ../azure-steps.yml
